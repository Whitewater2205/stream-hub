name: stream_hub
description: Responsive cross-platform streaming service hub prototype
publish_to: 'none'
version: 0.3.5+15

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  supabase_flutter: ^2.18.3

# shared_preferences_android 2.5.0 switched to a JNI-backed API that currently
# fails during startup on the Android 9 BlueStacks image used for previews.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/stream_hub_intro.wav

